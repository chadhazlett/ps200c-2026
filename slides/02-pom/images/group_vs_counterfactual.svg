<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 420" font-family="Helvetica, Arial, sans-serif" style="font-variant-ligatures: none;">

  <defs>
    <g id="person">
      <circle cx="0" cy="-32" r="9"/>
      <rect x="-10" y="-22" width="20" height="26" rx="4"/>
      <rect x="-10" y="4" width="8" height="24" rx="3"/>
      <rect x="2" y="4" width="8" height="24" rx="3"/>
      <rect x="-16" y="-20" width="7" height="22" rx="3"/>
      <rect x="9" y="-20" width="7" height="22" rx="3"/>
    </g>
    <g id="person-gray">
      <circle cx="0" cy="-32" r="9" fill="#ccc" stroke="#888" stroke-width="1.2"/>
      <rect x="-10" y="-22" width="20" height="26" rx="4" fill="#ccc" stroke="#888" stroke-width="1.2"/>
      <rect x="-10" y="4" width="8" height="24" rx="3" fill="#ccc" stroke="#888" stroke-width="1.2"/>
      <rect x="2" y="4" width="8" height="24" rx="3" fill="#ccc" stroke="#888" stroke-width="1.2"/>
      <rect x="-16" y="-20" width="7" height="22" rx="3" fill="#ccc" stroke="#888" stroke-width="1.2"/>
      <rect x="9" y="-20" width="7" height="22" rx="3" fill="#ccc" stroke="#888" stroke-width="1.2"/>
    </g>
  </defs>

  <!-- ====== TOP ROW: Group Comparison ====== -->

  <!-- Left label -->
  <text x="10" y="85" font-size="17" font-weight="bold" fill="#222">Group</text>
  <text x="10" y="105" font-size="17" font-weight="bold" fill="#222">comparison</text>

  <!-- Left group box -->
  <rect x="155" y="45" width="230" height="100" rx="10" fill="none" stroke="#2b5797" stroke-width="1.5"/>
  <text x="270" y="65" text-anchor="middle" font-size="13" fill="#2b5797" font-weight="bold">Treated Group</text>

  <!-- 4 blue people in a row -->
  <g transform="translate(195, 115)"><use href="#person" fill="#2b5797" transform="scale(0.85)"/></g>
  <g transform="translate(235, 115)"><use href="#person" fill="#2b5797" transform="scale(0.85)"/></g>
  <g transform="translate(275, 115)"><use href="#person" fill="#2b5797" transform="scale(0.85)"/></g>
  <g transform="translate(315, 115)"><use href="#person" fill="#2b5797" transform="scale(0.85)"/></g>

  <!-- Minus sign -->
  <line x1="400" y1="95" x2="430" y2="95" stroke="#222" stroke-width="3" stroke-linecap="round"/>
  <text x="415" y="115" text-anchor="middle" font-size="12" fill="#222" font-style="italic">compare</text>

  <!-- Right group box -->
  <rect x="445" y="45" width="230" height="100" rx="10" fill="none" stroke="#999" stroke-width="1.5"/>
  <text x="560" y="65" text-anchor="middle" font-size="13" fill="#777" font-weight="bold">Control Group</text>

  <!-- 4 gray people in a row -->
  <g transform="translate(485, 115)"><use href="#person" fill="#bbb" transform="scale(0.85)"/></g>
  <g transform="translate(525, 115)"><use href="#person" fill="#bbb" transform="scale(0.85)"/></g>
  <g transform="translate(565, 115)"><use href="#person" fill="#bbb" transform="scale(0.85)"/></g>
  <g transform="translate(605, 115)"><use href="#person" fill="#bbb" transform="scale(0.85)"/></g>

  <!-- Subtitle -->
  <text x="415" y="170" text-anchor="middle" font-size="13" fill="#555" font-style="italic">Contrasting two groups</text>

  <!-- ====== Divider ====== -->
  <line x1="130" y1="195" x2="700" y2="195" stroke="#ddd" stroke-width="1"/>

  <!-- ====== BOTTOM ROW: Counterfactual Comparison ====== -->

  <!-- Left label -->
  <text x="10" y="265" font-size="17" font-weight="bold" fill="#222">Causal</text>
  <text x="10" y="285" font-size="17" font-weight="bold" fill="#222">(counterfactual)</text>
  <text x="10" y="305" font-size="17" font-weight="bold" fill="#222">comparison</text>

  <!--
    Each pair: blue person, gray person offset (+12, -8).
    Bracket above heads: blue head top ~ (base.x, base.y - 35), gray head top ~ (base.x+12, base.y - 43).
    Arc bracket connecting above both heads, τ label above arc midpoint.
  -->

  <!-- Person 1: gray first (behind), blue on top -->
  <g transform="translate(187, 262)" opacity="0.6"><use href="#person-gray" transform="scale(0.85)"/></g>
  <g transform="translate(175, 270)"><use href="#person" fill="#2b5797" transform="scale(0.85)"/></g>
  <path d="M 175,229 Q 181,220 187,223" stroke="#c44" stroke-width="1.8" fill="none"/>
  <text x="181" y="216" text-anchor="middle" font-size="12" fill="#c44" font-style="italic">&#x3c4;&#x2081;</text>

  <!-- Person 2 -->
  <g transform="translate(257, 262)" opacity="0.6"><use href="#person-gray" transform="scale(0.85)"/></g>
  <g transform="translate(245, 270)"><use href="#person" fill="#2b5797" transform="scale(0.85)"/></g>
  <path d="M 245,229 Q 251,220 257,223" stroke="#c44" stroke-width="1.8" fill="none"/>
  <text x="251" y="216" text-anchor="middle" font-size="12" fill="#c44" font-style="italic">&#x3c4;&#x2082;</text>

  <!-- Person 3 -->
  <g transform="translate(327, 262)" opacity="0.6"><use href="#person-gray" transform="scale(0.85)"/></g>
  <g transform="translate(315, 270)"><use href="#person" fill="#2b5797" transform="scale(0.85)"/></g>
  <path d="M 315,229 Q 321,220 327,223" stroke="#c44" stroke-width="1.8" fill="none"/>
  <text x="321" y="216" text-anchor="middle" font-size="12" fill="#c44" font-style="italic">&#x3c4;&#x2083;</text>

  <!-- Person 4 -->
  <g transform="translate(397, 262)" opacity="0.6"><use href="#person-gray" transform="scale(0.85)"/></g>
  <g transform="translate(385, 270)"><use href="#person" fill="#2b5797" transform="scale(0.85)"/></g>
  <path d="M 385,229 Q 391,220 397,223" stroke="#c44" stroke-width="1.8" fill="none"/>
  <text x="391" y="216" text-anchor="middle" font-size="12" fill="#c44" font-style="italic">&#x3c4;&#x2084;</text>

  <!-- Person 5 -->
  <g transform="translate(467, 262)" opacity="0.6"><use href="#person-gray" transform="scale(0.85)"/></g>
  <g transform="translate(455, 270)"><use href="#person" fill="#2b5797" transform="scale(0.85)"/></g>
  <path d="M 455,229 Q 461,220 467,223" stroke="#c44" stroke-width="1.8" fill="none"/>
  <text x="461" y="216" text-anchor="middle" font-size="12" fill="#c44" font-style="italic">&#x3c4;&#x2085;</text>

  <!-- Person 6 -->
  <g transform="translate(537, 262)" opacity="0.6"><use href="#person-gray" transform="scale(0.85)"/></g>
  <g transform="translate(525, 270)"><use href="#person" fill="#2b5797" transform="scale(0.85)"/></g>
  <path d="M 525,229 Q 531,220 537,223" stroke="#c44" stroke-width="1.8" fill="none"/>
  <text x="531" y="216" text-anchor="middle" font-size="12" fill="#c44" font-style="italic">&#x3c4;&#x2086;</text>

  <!-- Person 7 -->
  <g transform="translate(607, 262)" opacity="0.6"><use href="#person-gray" transform="scale(0.85)"/></g>
  <g transform="translate(595, 270)"><use href="#person" fill="#2b5797" transform="scale(0.85)"/></g>
  <path d="M 595,229 Q 601,220 607,223" stroke="#c44" stroke-width="1.8" fill="none"/>
  <text x="601" y="216" text-anchor="middle" font-size="12" fill="#c44" font-style="italic">&#x3c4;&#x2087;</text>

  <!-- Person 8 -->
  <g transform="translate(677, 262)" opacity="0.6"><use href="#person-gray" transform="scale(0.85)"/></g>
  <g transform="translate(665, 270)"><use href="#person" fill="#2b5797" transform="scale(0.85)"/></g>
  <path d="M 665,229 Q 671,220 677,223" stroke="#c44" stroke-width="1.8" fill="none"/>
  <text x="671" y="216" text-anchor="middle" font-size="12" fill="#c44" font-style="italic">&#x3c4;&#x2088;</text>

  <!-- Legend row -->
  <g transform="translate(230, 375)">
    <use href="#person" fill="#2b5797" transform="scale(0.5)"/>
  </g>
  <text x="248" y="377" font-size="11" fill="#2b5797">= treated</text>

  <g transform="translate(330, 375)" opacity="0.6">
    <use href="#person-gray" transform="scale(0.5)"/>
  </g>
  <text x="348" y="377" font-size="11" fill="#888">= untreated</text>

  <text x="450" y="377" font-size="11" fill="#c44" font-style="italic">&#x3c4;&#x1d62; = individual contrast</text>

  <!-- Subtitle -->
  <text x="415" y="345" text-anchor="middle" font-size="13" fill="#555" font-style="italic">Contrasting two (potential) outcomes for everybody</text>

</svg>
