<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" font-family="Georgia, serif">

  <defs>
    <g id="person">
      <circle cx="0" cy="-32" r="9"/>
      <rect x="-10" y="-22" width="20" height="26" rx="4"/>
      <rect x="-10" y="4" width="8" height="24" rx="3"/>
      <rect x="2" y="4" width="8" height="24" rx="3"/>
      <rect x="-16" y="-20" width="7" height="22" rx="3"/>
      <rect x="9" y="-20" width="7" height="22" rx="3"/>
    </g>
  </defs>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Group Comparison</text>

  <!-- Left group box (no fill) -->
  <rect x="30" y="50" width="280" height="240" rx="12" fill="none" stroke="#2b5797" stroke-width="1.5"/>
  <text x="170" y="78" text-anchor="middle" font-size="16" fill="#2b5797" font-weight="bold">Treated Group</text>

  <!-- Left group people (blue) - 4 in a 2x2 -->
  <g transform="translate(110, 145)"><use href="#person" fill="#2b5797"/></g>
  <g transform="translate(200, 145)"><use href="#person" fill="#2b5797"/></g>
  <g transform="translate(110, 230)"><use href="#person" fill="#2b5797"/></g>
  <g transform="translate(200, 230)"><use href="#person" fill="#2b5797"/></g>

  <!-- Right group box (no fill) -->
  <rect x="390" y="50" width="280" height="240" rx="12" fill="none" stroke="#999" stroke-width="1.5"/>
  <text x="530" y="78" text-anchor="middle" font-size="16" fill="#777" font-weight="bold">Control Group</text>

  <!-- Right group people (gray) - 4 in a 2x2 -->
  <g transform="translate(470, 145)"><use href="#person" fill="#bbb"/></g>
  <g transform="translate(560, 145)"><use href="#person" fill="#bbb"/></g>
  <g transform="translate(470, 230)"><use href="#person" fill="#bbb"/></g>
  <g transform="translate(560, 230)"><use href="#person" fill="#bbb"/></g>

  <!-- Minus sign between boxes -->
  <line x1="330" y1="170" x2="370" y2="170" stroke="#222" stroke-width="3.5" stroke-linecap="round"/>
  <text x="350" y="195" text-anchor="middle" font-size="14" fill="#222" font-style="italic">compare</text>

  <!-- Bottom label -->
  <text x="350" y="330" text-anchor="middle" font-size="15" fill="#555" font-style="italic">Different people in each group</text>

</svg>
