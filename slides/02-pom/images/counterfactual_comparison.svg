<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" font-family="Georgia, serif">

  <defs>
    <g id="person">
      <circle cx="0" cy="-32" r="9"/>
      <rect x="-10" y="-22" width="20" height="26" rx="4"/>
      <rect x="-10" y="4" width="8" height="24" rx="3"/>
      <rect x="2" y="4" width="8" height="24" rx="3"/>
      <rect x="-16" y="-20" width="7" height="22" rx="3"/>
      <rect x="9" y="-20" width="7" height="22" rx="3"/>
    </g>
    <!-- Gray person with outline for visibility -->
    <g id="person-gray">
      <circle cx="0" cy="-32" r="9" fill="#ccc" stroke="#888" stroke-width="1.2"/>
      <rect x="-10" y="-22" width="20" height="26" rx="4" fill="#ccc" stroke="#888" stroke-width="1.2"/>
      <rect x="-10" y="4" width="8" height="24" rx="3" fill="#ccc" stroke="#888" stroke-width="1.2"/>
      <rect x="2" y="4" width="8" height="24" rx="3" fill="#ccc" stroke="#888" stroke-width="1.2"/>
      <rect x="-16" y="-20" width="7" height="22" rx="3" fill="#ccc" stroke="#888" stroke-width="1.2"/>
      <rect x="9" y="-20" width="7" height="22" rx="3" fill="#ccc" stroke="#888" stroke-width="1.2"/>
    </g>
  </defs>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Counterfactual Comparison</text>

  <!--
    Each pair: blue person at base position, gray person offset (+14, -10) (up and right).
    Angled bracket connects left foot of blue to left foot of gray, pushed down below figures.
    Blue left foot: (base.x - 10, base.y + 28)
    Gray left foot: (base.x + 4, base.y + 18)
  -->

  <!-- Person 1 -->
  <g transform="translate(80, 120)"><use href="#person" fill="#2b5797"/></g>
  <g transform="translate(94, 110)" opacity="0.6"><use href="#person-gray"/></g>
  <line x1="70" y1="158" x2="84" y2="148" stroke="#c44" stroke-width="2"/>
  <text x="92" y="168" text-anchor="middle" font-size="14" fill="#c44" font-style="italic">&#x3c4;&#x2081;</text>

  <!-- Person 2 -->
  <g transform="translate(195, 120)"><use href="#person" fill="#2b5797"/></g>
  <g transform="translate(209, 110)" opacity="0.6"><use href="#person-gray"/></g>
  <line x1="185" y1="158" x2="199" y2="148" stroke="#c44" stroke-width="2"/>
  <text x="207" y="168" text-anchor="middle" font-size="14" fill="#c44" font-style="italic">&#x3c4;&#x2082;</text>

  <!-- Person 3 -->
  <g transform="translate(310, 120)"><use href="#person" fill="#2b5797"/></g>
  <g transform="translate(324, 110)" opacity="0.6"><use href="#person-gray"/></g>
  <line x1="300" y1="158" x2="314" y2="148" stroke="#c44" stroke-width="2"/>
  <text x="322" y="168" text-anchor="middle" font-size="14" fill="#c44" font-style="italic">&#x3c4;&#x2083;</text>

  <!-- Person 4 -->
  <g transform="translate(425, 120)"><use href="#person" fill="#2b5797"/></g>
  <g transform="translate(439, 110)" opacity="0.6"><use href="#person-gray"/></g>
  <line x1="415" y1="158" x2="429" y2="148" stroke="#c44" stroke-width="2"/>
  <text x="437" y="168" text-anchor="middle" font-size="14" fill="#c44" font-style="italic">&#x3c4;&#x2084;</text>

  <!-- Person 5 -->
  <g transform="translate(540, 120)"><use href="#person" fill="#2b5797"/></g>
  <g transform="translate(554, 110)" opacity="0.6"><use href="#person-gray"/></g>
  <line x1="530" y1="158" x2="544" y2="148" stroke="#c44" stroke-width="2"/>
  <text x="552" y="168" text-anchor="middle" font-size="14" fill="#c44" font-style="italic">&#x3c4;&#x2085;</text>

  <!-- Person 6 -->
  <g transform="translate(140, 230)"><use href="#person" fill="#2b5797"/></g>
  <g transform="translate(154, 220)" opacity="0.6"><use href="#person-gray"/></g>
  <line x1="130" y1="268" x2="144" y2="258" stroke="#c44" stroke-width="2"/>
  <text x="152" y="278" text-anchor="middle" font-size="14" fill="#c44" font-style="italic">&#x3c4;&#x2086;</text>

  <!-- Person 7 -->
  <g transform="translate(310, 230)"><use href="#person" fill="#2b5797"/></g>
  <g transform="translate(324, 220)" opacity="0.6"><use href="#person-gray"/></g>
  <line x1="300" y1="268" x2="314" y2="258" stroke="#c44" stroke-width="2"/>
  <text x="322" y="278" text-anchor="middle" font-size="14" fill="#c44" font-style="italic">&#x3c4;&#x2087;</text>

  <!-- Person 8 -->
  <g transform="translate(480, 230)"><use href="#person" fill="#2b5797"/></g>
  <g transform="translate(494, 220)" opacity="0.6"><use href="#person-gray"/></g>
  <line x1="470" y1="268" x2="484" y2="258" stroke="#c44" stroke-width="2"/>
  <text x="492" y="278" text-anchor="middle" font-size="14" fill="#c44" font-style="italic">&#x3c4;&#x2088;</text>

  <!-- Legend -->
  <g transform="translate(140, 330)">
    <use href="#person" fill="#2b5797" transform="scale(0.6)"/>
  </g>
  <text x="160" y="332" font-size="12" fill="#2b5797">= treated version</text>

  <g transform="translate(330, 330)" opacity="0.6">
    <use href="#person-gray" transform="scale(0.6)"/>
  </g>
  <text x="350" y="332" font-size="12" fill="#888">= untreated version</text>

  <!-- Spell out "effect" to avoid ligature issues -->
  <text x="540" y="332" font-size="13" fill="#c44" font-style="italic">&#x3c4;&#x1d62; = individual causal e&#x200B;f&#x200B;fect</text>

  <!-- Bottom label -->
  <text x="350" y="355" text-anchor="middle" font-size="15" fill="#555" font-style="italic">Same person, two potential lives</text>

</svg>
